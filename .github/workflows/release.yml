name: Release

# Publish a release with the installable add-on ZIP.
# Triggers:
#   - a pushed commit that changes the version in blender_manifest.toml
#     (a release is only created if "v<version>" does not exist yet),
#   - a pushed tag "v<version>" matching blender_manifest.toml,
#   - a manual run from the Actions tab.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - "svg_to_mesh/blender_manifest.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read version and check for an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python build.py --version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $VERSION"
            exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists - nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system libraries needed by the bpy module
        if: steps.version.outputs.exists == 'false'
        run: sudo apt-get update && sudo apt-get install -y libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1
      - name: Install Python dependencies
        if: steps.version.outputs.exists == 'false'
        run: pip install pytest numpy bpy==5.0.1
      - name: Run tests
        if: steps.version.outputs.exists == 'false'
        run: python -m pytest -v
      - name: Build add-on ZIP
        if: steps.version.outputs.exists == 'false'
        run: python build.py

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SVG to Clean Mesh v${{ steps.version.outputs.version }}
          files: dist/svg_to_mesh-${{ steps.version.outputs.version }}.zip
          fail_on_unmatched_files: true
          body: |
            Import SVG files and trace images (logos) into clean, manifold meshes that are ready for booleans.

            ## Installation
            1. Download **svg_to_mesh-${{ steps.version.outputs.version }}.zip** below (do not unzip it).
            2. **Blender 4.2+:** *Edit → Preferences → Get Extensions → ⌄ (top right) → Install from Disk…*
               **Blender 3.6 – 4.1:** *Edit → Preferences → Add-ons → Install…*, then enable the add-on.
            3. Open the 3D Viewport sidebar (**N**) → **SVG Mesh** tab, or use *File → Import*.

            See the [README](https://github.com/${{ github.repository }}#readme) for usage and options.
