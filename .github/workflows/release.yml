name: Release

# Publish a release with the installable add-on ZIP.
# Triggers:
#   - a pushed commit that changes the version in blender_manifest.toml
#     (a release is only created if "v<version>" does not exist yet),
#   - a pushed tag "v<version>" matching blender_manifest.toml,
#   - a manual run from the Actions tab.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - "svg_to_mesh/blender_manifest.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Read version and check for an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python build.py --version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $VERSION"
            exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists - nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system libraries needed by the bpy module
        if: steps.version.outputs.exists == 'false'
        run: sudo apt-get update && sudo apt-get install -y libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1
      - name: Install Python dependencies
        if: steps.version.outputs.exists == 'false'
        run: pip install pytest numpy bpy==5.0.1
      - name: Run tests
        if: steps.version.outputs.exists == 'false'
        run: python -m pytest -v
      - name: Build add-on ZIP
        if: steps.version.outputs.exists == 'false'
        run: python build.py
      - name: Write release notes from CHANGELOG.md
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: python tools/release_notes.py "$VERSION" "$REPO" > dist/release_notes.md

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SVG to Clean Mesh v${{ steps.version.outputs.version }}
          files: dist/svg_to_mesh-${{ steps.version.outputs.version }}.zip
          fail_on_unmatched_files: true
          body_path: dist/release_notes.md
